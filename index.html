<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Night</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --text: #1d1b18;
      --muted: #6b6760;
      --accent: #4a3aff;
      --accent-text: #ffffff;
      --card: #ffffff;
      --border: #e4e0d8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14131a;
        --text: #f1eff8;
        --muted: #a19dad;
        --accent: #8b80ff;
        --accent-text: #14131a;
        --card: #1e1c26;
        --border: #2e2b3a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 48px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.25rem, 8vw, 3.25rem);
      letter-spacing: -0.02em;
    }

    .date {
      margin: 0 0 32px;
      font-size: 1.125rem;
      color: var(--muted);
    }

    button {
      padding: 14px 32px;
      font: inherit;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover { opacity: 0.9; }

    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .confirmation {
      min-height: 1.5em;
      margin: 16px 0 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Test Night</h1>
    <p class="date">
      <time datetime="2026-11-13T19:00">Friday, November 13, 2026 &middot; 7:00 PM</time>
    </p>
    <button type="button" id="rsvp">RSVP</button>
    <p class="confirmation" id="confirmation" aria-live="polite"></p>
  </main>

  <script>
    // Give the RSVP button a random color on each page load.
    (function () {
      var button = document.getElementById("rsvp");
      var lastHue = NaN;
      try { lastHue = parseFloat(localStorage.getItem("rsvpHue")); } catch (e) {}

      // Keep picking until the hue is clearly different from the last visit's.
      var hue;
      do {
        hue = Math.floor(Math.random() * 360);
      } while (!isNaN(lastHue) &&
               Math.min(Math.abs(hue - lastHue), 360 - Math.abs(hue - lastHue)) < 60);
      try { localStorage.setItem("rsvpHue", hue); } catch (e) {}

      // Convert HSL to RGB so we can pick readable text (black or white).
      var s = 0.75, l = 0.5;
      function channel(n) {
        var k = (n + hue / 30) % 12;
        return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
      }
      function linear(c) {
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      }
      var luminance = 0.2126 * linear(channel(0)) +
                      0.7152 * linear(channel(8)) +
                      0.0722 * linear(channel(4));
      var contrastWhite = 1.05 / (luminance + 0.05);
      var contrastBlack = (luminance + 0.05) / 0.05;

      button.style.setProperty("--accent", "hsl(" + hue + ", 75%, 50%)");
      button.style.setProperty("--accent-text", contrastWhite >= contrastBlack ? "#ffffff" : "#111111");
    })();

    document.getElementById("rsvp").addEventListener("click", function () {
      this.textContent = "You're going!";
      this.disabled = true;
      document.getElementById("confirmation").textContent = "See you at Test Night.";
    });
  </script>
</body>
</html>
