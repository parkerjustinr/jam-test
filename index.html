<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Night</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --text: #1d1b18;
      --muted: #6b6760;
      --accent: #4a3aff;
      --accent-text: #ffffff;
      --card: #ffffff;
      --border: #e4e0d8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14131a;
        --text: #f1eff8;
        --muted: #a19dad;
        --accent: #8b80ff;
        --accent-text: #14131a;
        --card: #1e1c26;
        --border: #2e2b3a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 48px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.25rem, 8vw, 3.25rem);
      letter-spacing: -0.02em;
    }

    .date {
      margin: 0 0 32px;
      font-size: 1.125rem;
      color: var(--muted);
    }

    button {
      padding: 14px 32px;
      font: inherit;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover { opacity: 0.9; }

    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .confirmation {
      min-height: 1.5em;
      margin: 16px 0 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Test Night</h1>
    <p class="date">
      <time datetime="2026-11-13T19:00">Friday, November 13, 2026 &middot; 7:00 PM</time>
    </p>
    <button type="button" id="rsvp">RSVP</button>
    <p class="confirmation" id="confirmation" aria-live="polite"></p>
  </main>

  <script>
    document.getElementById("rsvp").addEventListener("click", function () {
      this.textContent = "You're going!";
      this.disabled = true;
      document.getElementById("confirmation").textContent = "See you at Test Night.";
    });
  </script>
</body>
</html>
